<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회의실 예약</title>
<style>
/* Layout idea: the paper sign-up sheet, kept as a sheet. Day = rooms across, week = days across, month = wall calendar, door = one room's sign. */
:root {
  --bg: #eef1f4;
  --sheet: #ffffff;
  --ink: #17212b;
  --muted: #5d6b79;
  --line: #d5dce3;
  --line-strong: #aab5c0;
  --accent: #1f5fbf;
  --accent-ink: #ffffff;
  --accent-soft: #dfeafb;
  --accent-strong: var(--accent);   /* 흰 글자를 올리는 채움 · 강조색 글자 (4.5:1 이상이 되도록 테마가 따로 정할 수 있음) */
  --other: #e9edf1;
  --other-stripe: #6b7a89;
  --free: #1d7a4f;
  --free-soft: #dff2e8;
  --busy: #b4491f;
  --busy-soft: #fbe6dc;
  --now: #d2341f;
  --font-display: "Gothic A1", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --row: 40px;
  --head: 48px;
  --timecol: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #12171c; --sheet: #1a2129; --ink: #e6ebf0; --muted: #94a2b0;
    --line: #2b3540; --line-strong: #46535f;
    --accent: #6ea6f5; --accent-ink: #0c1622; --accent-soft: #1e3352;
    --other: #252e38; --other-stripe: #8695a4;
    --free: #5fcb95; --free-soft: #173326; --busy: #f0966c; --busy-soft: #3a2218; --now: #ff6b57;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #12171c; --sheet: #1a2129; --ink: #e6ebf0; --muted: #94a2b0;
  --line: #2b3540; --line-strong: #46535f;
  --accent: #6ea6f5; --accent-ink: #0c1622; --accent-soft: #1e3352;
  --other: #252e38; --other-stripe: #8695a4;
  --free: #5fcb95; --free-soft: #173326; --busy: #f0966c; --busy-soft: #3a2218; --now: #ff6b57;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 1600px; margin: 0 auto; padding: 20px 16px 40px; display: flex; flex-direction: column; gap: 14px; }   /* 1.41: 1100 → 1600px (넓은 모니터에서 더 넓게) */
.wrap[data-view="month"] { padding-bottom: 16px; }                    /* 월간은 한 화면에 맞추므로 아래 여백을 줄임 */

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 24px; margin: 0; letter-spacing: -0.01em; }
.nav, .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.datelabel { font-family: var(--font-display); font-weight: 700; font-size: 18px; min-width: 9.5em; text-align: center; border: 0; background: transparent; color: inherit; border-radius: 6px; padding: 4px 6px; cursor: pointer; }
.datelabel:hover { background: var(--accent-soft); }
.tools.right { position: relative; }
#tMore { display: none; }
.menu { display: contents; }
.btn { border: 1px solid var(--line-strong); background: var(--sheet); border-radius: 6px; padding: 7px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--accent-ink); font-weight: 600; }
.btn.danger { color: var(--busy); border-color: var(--busy); }
.btn.danger.solid { background: var(--busy); color: #fff; }
.ask { border: 1.5px solid var(--busy); border-radius: 10px; padding: 10px 12px; margin: 8px 0 4px; background: var(--busy-soft, #FBE7E1); }
.ask p { margin: 0 0 8px; font-weight: 600; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.icon { padding: 7px 10px; font-family: var(--font-mono); }
.btn.small { padding: 3px 9px; font-size: 13px; }
.linkbtn { border: 0; background: transparent; padding: 2px 0; min-height: 24px; color: var(--accent-strong); cursor: pointer; font-size: 13px; text-decoration: underline; text-align: left; }
input[type="date"], input[type="text"], input[type="number"], select {
  border: 1px solid var(--line-strong); background: var(--sheet); border-radius: 6px; padding: 7px 10px;
}
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; background: var(--sheet); }
.seg button { border: 0; background: transparent; padding: 7px 14px; cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-strong); color: var(--accent-ink); font-weight: 600; }

.notice { background: var(--busy-soft); color: var(--ink); border-left: 4px solid var(--busy); padding: 10px 14px; border-radius: 4px; }

.status { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.chip { background: var(--sheet); border: 1px solid var(--line); border-left: 5px solid var(--free); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.chip.busy { border-left-color: var(--busy); }
.chip .room { font-weight: 600; }
.chip .state { font-size: 13px; font-weight: 600; color: var(--free); }
.chip.busy .state { color: var(--busy); }
.chip .sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.hint { color: var(--muted); font-size: 13px; margin: 0; }
.sheetbox { background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }
.grid { display: grid; position: relative; min-width: max-content;
  grid-template-columns: var(--timecol) repeat(var(--n), minmax(var(--colmin, 140px), 1fr));
  grid-template-rows: minmax(var(--head), auto) repeat(var(--rows), var(--row)); }
.corner, .time { position: sticky; left: 0; z-index: 3; background: var(--sheet); border-right: 1px solid var(--line-strong); }
.corner { border-bottom: 1px solid var(--line-strong); }
.colhead { border-bottom: 1px solid var(--line-strong); border-left: 1px solid var(--line); padding: 6px 10px; display: flex; flex-direction: column; justify-content: center; max-width: 260px; }
.colhead b { font-weight: 600; overflow-wrap: anywhere; line-height: 1.2; }
.colhead span { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.colhead.today { background: var(--accent-soft); box-shadow: inset 0 -3px 0 var(--accent); }   /* 오늘: 옅은 바탕 + 아래 줄 (글자는 본문색 — 옅은 바탕 위 강조색 글자는 대비가 모자람) */
.colhead.today b { color: var(--ink); }
.colhead.today span, .wk-day.today span { color: var(--ink); }                                      /* 옅은 바탕 위 회색 글자는 4.48:1 이라 본문색으로 */
.colhead.link { cursor: pointer; }
.time { font-family: var(--font-mono); font-size: 12px; color: var(--muted); text-align: right; padding: 2px 8px 0 0; font-variant-numeric: tabular-nums; border-top: 1px solid var(--line-strong); }
.cell { border: 0; border-left: 1px solid var(--line); border-top: 1px dashed var(--line); background: transparent; cursor: pointer; color: var(--ink); font-size: 12px; text-align: left; padding: 0 0 0 8px; }
.cell.hour { border-top: 1px solid var(--line-strong); }
.cell span { opacity: 0; }
.cell:hover:not(:disabled), .cell:focus-visible { background: var(--accent-soft); }
.cell:hover:not(:disabled) span, .cell:focus-visible span { opacity: 1; }
.cell:disabled { cursor: default; }
.cell.past { background: repeating-linear-gradient(135deg, transparent 0 6px, var(--other) 6px 7px); }
.bk { z-index: 2; margin: 2px 3px 2px 4px; border-radius: 5px; background: var(--other); border: 0; border-left: 4px solid var(--other-stripe); padding: 3px 8px; text-align: left; cursor: pointer; overflow: hidden; display: flex; flex-direction: column; gap: 0; min-width: 0; }
.bk.mine { background: var(--accent-soft); border-left-color: var(--accent); }
.bk.block, .mi.block { background: repeating-linear-gradient(135deg, var(--busy-soft) 0 8px, var(--sheet) 8px 12px); border-left-color: var(--busy); }
.bk .l1 { display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bk .l2 { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bk .l2 b { font-weight: 600; }
.bk .plus { margin-left: auto; font-family: var(--font-body); font-size: 12px; font-weight: 600; background: var(--accent-strong); color: var(--accent-ink); border-radius: 999px; padding: 0 7px; line-height: 18px; }
.rep { font-family: var(--font-body); font-size: 11px; color: var(--ink); border: 1px solid var(--line-strong); border-radius: 3px; padding: 0 4px; line-height: 15px; }
.nowline { height: 0; border-top: 2px solid var(--now); z-index: 4; pointer-events: none; align-self: start; position: relative; scroll-margin: 100px 0 140px; }
.nowline::before { content: ""; position: absolute; left: -4px; top: -5px; width: 8px; height: 8px; border-radius: 50%; background: var(--now); }
.empty { padding: 36px 20px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 12px; }

.month { display: grid; grid-template-columns: repeat(7, minmax(108px, 1fr)); min-width: max-content; }
.month .wd { padding: 8px 10px; font-size: 13px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line-strong); border-left: 1px solid var(--line); }
.month .wd:first-child, .mday:nth-child(7n+1) { border-left: 0; }
.mday { min-height: 0; overflow: hidden; border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 6px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; min-width: 0; }
.mday:hover { background: var(--accent-soft); }
.mday.out { background: var(--bg); }
.mday.out .num { color: var(--muted); }
.mday .num { align-self: flex-start; border: 0; background: transparent; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px; padding: 1px 6px; min-width: 24px; min-height: 24px; border-radius: 999px; cursor: pointer; }
.mday.today .num { background: var(--accent-strong); color: var(--accent-ink); }
.mi { border: 0; background: var(--other); border-left: 3px solid var(--other-stripe); border-radius: 3px; padding: 1px 6px; font-size: 12px; text-align: left; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; display: block; width: 100%; }
.mi.mine { background: var(--accent-soft); border-left-color: var(--accent); }
.mi .mono { font-size: 11px; margin-right: 4px; }
.more { font-size: 12px; color: var(--muted); padding-left: 6px; }
.wkall { display: grid; grid-template-columns: minmax(104px, 144px) repeat(var(--n), minmax(124px, 1fr)); min-width: calc(104px + var(--n) * 124px); }
.wk-corner, .wk-room { position: sticky; left: 0; z-index: 2; background: var(--sheet); border-right: 1px solid var(--line-strong); }
.wk-corner { border-bottom: 1px solid var(--line-strong); padding: 8px 10px; font-size: 13px; font-weight: 600; color: var(--muted); display: flex; align-items: center; }
.wk-day { border: 0; border-left: 1px solid var(--line); border-bottom: 1px solid var(--line-strong); background: transparent; color: inherit; font: inherit; text-align: left; padding: 6px 10px; cursor: pointer; display: flex; flex-direction: column; justify-content: center; }
.wk-day:first-of-type { border-left: 0; }
.wk-day b { font-weight: 600; line-height: 1.2; }
.wk-day span, .wk-room span { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.wk-day.today { background: var(--accent-soft); box-shadow: inset 0 -3px 0 var(--accent); }
.wk-day.today b { color: var(--ink); }
.wk-day:hover b, .wk-room:hover b { text-decoration: underline; }
.wk-room { border: 0; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line-strong); color: inherit; font: inherit; text-align: left; padding: 8px 10px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.wk-room b { font-weight: 600; overflow-wrap: anywhere; line-height: 1.25; }
.wk-cell { border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 6px; display: flex; flex-direction: column; gap: 3px; min-height: 84px; min-width: 0; }
.wk-room + .wk-cell { border-left: 0; }
.wk-cell.past { background: var(--bg); }
.wk-bar { position: relative; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-bottom: 2px; flex: none; }
.wk-bar i { position: absolute; top: 0; bottom: 0; background: var(--other-stripe); }
.wk-bar i.mine { background: var(--accent); }
.wk-bar i.block { background: var(--busy); }
.wi { border: 0; background: var(--other); border-left: 3px solid var(--other-stripe); border-radius: 3px; padding: 2px 6px; font: inherit; font-size: 12px; color: inherit; text-align: left; cursor: pointer; display: block; width: 100%; min-width: 0; }
.wi.mine { background: var(--accent-soft); border-left-color: var(--accent); }
.wi.block { background: repeating-linear-gradient(135deg, var(--busy-soft) 0 8px, var(--sheet) 8px 12px); border-left-color: var(--busy); }
.wi .mono { display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.wi .rep { font-family: var(--font-body); font-size: 11px; color: var(--ink); }
.wi .tx { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wi .tx b { font-weight: 600; }
.wk-add { align-self: flex-start; border: 1px dashed var(--line-strong); background: transparent; color: var(--muted); border-radius: 3px; font: inherit; font-size: 12px; padding: 1px 8px; min-height: 24px; cursor: pointer; margin-top: auto; }
.wk-add:hover { border-color: var(--accent); color: var(--accent-strong); }
.wk-full { font-size: 12px; color: var(--muted); padding-left: 2px; margin-top: auto; }

dialog { border: 1px solid var(--line-strong); border-radius: 10px; background: var(--sheet); color: var(--ink); padding: 0; width: min(460px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
dialog.wide { width: min(620px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(10, 16, 22, .5); }
.dlg { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.dlg h2 { font-family: var(--font-display); font-weight: 700; font-size: 18px; margin: 0; }
.dlg h3 { font-size: 14px; font-weight: 600; margin: 0; }
.dlg .meta { display: flex; flex-direction: column; gap: 2px; }
.dlg .meta .big { font-family: var(--font-mono); font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .lab { font-size: 13px; color: var(--muted); }
.field input, .field select { width: 100%; }
.row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.why { font-size: 13px; color: var(--muted); margin: 0; }
.err { font-size: 13px; color: var(--busy); margin: 0; min-height: 1.2em; }
.warn { font-size: 13px; color: var(--busy); margin: 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt { border: 1px solid var(--line); border-radius: 6px; }
.opt > summary { cursor: pointer; padding: 8px 12px; min-height: 40px; font-size: 13px; display: flex; align-items: center; gap: 8px; list-style: none; border-radius: 6px; }
.opt > summary::-webkit-details-marker { display: none; }
.opt > summary::before { content: ""; width: 7px; height: 7px; flex: none; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; }
.opt[open] > summary::before { transform: rotate(45deg); }
.opt .optsum { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.opt .optbody { padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 12px; }
@media (prefers-reduced-motion: reduce) { .opt > summary::before { transition: none; } }
.checks { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; }
.checks label { display: inline-flex; align-items: center; gap: 5px; color: var(--ink); }
.roomset { border: 1px solid var(--line); border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.roomrow { display: grid; grid-template-columns: 1fr 76px auto; gap: 8px; align-items: center; }
.list { display: flex; flex-direction: column; gap: 6px; }
.item { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--sheet); text-align: left; }
button.item { cursor: pointer; width: 100%; }
button.item:hover { border-color: var(--accent); }
.item .t { font-weight: 600; overflow-wrap: anywhere; }
.item .s { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.item > div { min-width: 0; }
.stat { display: grid; grid-template-columns: minmax(70px, auto) 1fr auto; gap: 6px 10px; align-items: center; font-size: 13px; }
.meter { height: 10px; background: var(--other); border-radius: 2px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.stat .v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--sheet); padding: 9px 16px; border-radius: 6px; font-size: 14px; z-index: 10; max-width: calc(100vw - 32px); }

.door { max-width: 860px; margin: 0 auto; padding: 20px 16px 40px; display: flex; flex-direction: column; gap: 16px; }
.doorhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; }
.doorhead .clock { font-family: var(--font-mono); font-size: 20px; font-variant-numeric: tabular-nums; color: var(--muted); }
.panel { border-radius: 12px; padding: 28px 24px; background: var(--free-soft); border-left: 10px solid var(--free); display: flex; flex-direction: column; gap: 8px; }
.panel.busy { background: var(--busy-soft); border-left-color: var(--busy); }
.panel .rname { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1.15; overflow-wrap: anywhere; }
.panel .st { font-family: var(--font-display); font-weight: 800; font-size: 56px; line-height: 1.1; color: var(--free); }
.panel.busy .st { color: var(--busy); }
.panel .what { font-size: 20px; overflow-wrap: anywhere; }
.panel .next { font-size: 16px; color: var(--muted); }
.dooract { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.dooract .btn { padding: 12px 20px; font-size: 17px; }
.dooract input { padding: 12px; font-size: 16px; width: 11em; }
.seg.small button { padding: 4px 10px; font-size: 13px; }
/* 좁은 화면 (1.42): 머리 부분을 줄여 예약표가 위에서 시작하게 — 날짜 글자가 날짜 고르기, 내 예약 · 통계 · 설정 · 사용법은 [더보기] 안으로, 현황은 옆으로 넘겨 봄 */
@media (max-width: 640px) {
  .wrap { padding: 12px 10px 32px; gap: 10px; }
  h1 { font-size: 20px; }
  .top { gap: 8px; }
  .top > .tools { justify-content: space-between; width: 100%; }
  .nav { position: relative; flex-wrap: nowrap; gap: 6px; width: 100%; }
  .datelabel { order: -1; flex: 1; min-width: 0; text-align: left; font-size: 17px; padding-left: 2px; }
  html:not(.nopicker) #pick { position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; min-height: 0; opacity: 0; padding: 0; border: 0; pointer-events: none; }
  .bar { gap: 8px; }
  .bar .btn, .bar .seg button { padding: 7px 9px; font-size: 14px; }
  .tools.right { margin-left: auto; gap: 6px; }
  #tMore { display: inline-flex; align-items: center; }
  .menu { display: none; position: absolute; right: 0; top: calc(100% + 6px); z-index: 6; min-width: 190px; flex-direction: column; gap: 6px; padding: 8px;
    background: var(--sheet); border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, .18); }
  .menu.open { display: flex; }
  .menu .btn { width: 100%; text-align: left; }
  .status { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 2px; scroll-snap-type: x proximity; }
  .status .chip { flex: 0 0 250px; scroll-snap-align: start; padding: 2px 10px 8px; display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 8px; row-gap: 0; align-items: center; }
  .status .chip .room { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status .chip .linkbtn { grid-column: 2; grid-row: 1; min-height: 36px; }
  .status .chip .state, .status .chip .sub { grid-column: 1 / -1; }
  .status .chip .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

<script>
/* 회의실 예약 — 바깥(인터넷) 판의 저장 · 로그인 (결정 101)
   Workspace 서버 대신 Firebase Realtime Database 에 저장합니다. 화면(예약 로직)은 Workspace 판과 같은 원본에서 만들고,
   그 원본이 쓰는 저장 함수(LW.store 의 get · set · update · watch)만 여기서 같은 모양으로 다시 만듭니다 → meeting-room-shim.js 를 그대로 씀.

   자료 모양 (/mr 아래)
     secret/{code, admin}        접속 코드 · 관리자 코드. Firebase 콘솔에서만 넣고 바꿈 (규칙이 읽기 · 쓰기를 모두 막음)
     members/<uid>/{name, code, admin?, at}   이 브라우저의 익명 계정이 '코드를 맞게 넣었다'는 표시. 규칙이 secret 과 같은지 봄
     d/<key>/{r, v}              문서 하나 = 판 번호 r + JSON 글자 v   (key: config_main · series · days_YYYY-MM · lock)
     r/<key>                     그 문서의 판 번호만 (바뀐 것만 다시 받으려고 이것을 봄 — 쓰는 중 5초마다, 쉬면 더 드물게)
   동시에 고치기: 쓰는 쪽이 r+1 을 보내고, 규칙이 '지금 r 보다 정확히 1 큰 것'만 받음 → 늦은 쪽은 거절되고 다시 읽어 다시 씀.
   Firebase SDK 를 쓰지 않고 fetch 만 씁니다 (회사 프록시를 잘 지나가고, 파일 하나로 끝남). */
var EXT = (function () {
  "use strict";
  var CFG = window.MR_CONFIG || null;
  var DB = CFG ? String(CFG.databaseURL || "").replace(/\/+$/, "") : "";
  var AUTH_URL = (CFG && CFG.authURL) || "https://identitytoolkit.googleapis.com/v1";
  var TOKEN_URL = (CFG && CFG.tokenURL) || "https://securetoken.googleapis.com/v1";
  var ROOT = "/mr", POLL = 5000;
  var LOGIN = CFG && (CFG.login === "ws" || CFG.login === "both") ? CFG.login : "code";   // ws = Workspace 계정만 · both = 접속 코드도 · code = 접속 코드만(0.1 의 config.js)
  var VER = "0.4.1";                                         // build.py 가 넣음
  var api = { onUpdate: null, onDenied: null, version: VER };

  function load(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } }
  function save(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 저장이 막힌 브라우저: 탭을 닫으면 다시 물음 */ } }
  var en = function () { try { return localStorage.getItem("roomBookLang") === "en"; } catch (e) { return false; } };
  var tx = function (ko, e) { return en() ? e : ko; };
  var auth = load("mrx.auth");          // {uid, idToken, refreshToken, exp, at, ws?}
  var who = load("mrx.me");             // 접속 코드: {name, code, admin} · Workspace 계정: {ws: 1, id, name, lv, until, pj, tm}
  var IMP = /[#&]imp=1(?:&|$)/.test(location.hash);   // 0.3: Workspace 의 [전환] · [자료 옮기기]로 열림 → 들어간 뒤 사내 자료를 받아 가져오기 창을 띄움
  var T0 = tokenIn(location.hash);      // Workspace 에서 넘어온 연결 표(#t=…). 화면의 다른 코드가 주소를 만지기 전에 꺼내고, 주소에서는 바로 지움
  var PAIR = /[#&]pair=1(?:&|$)/.test(location.hash);   // 0.4: Workspace 의 [연결 코드 만들기]로 열림 → 다른 기기에 넣을 8자리 코드를 만들어 보여 줌 (이 브라우저의 연결은 건드리지 않음)
  var PT = (/[#&]pt=([A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+)/.exec(location.hash) || [])[1] || "";   // 그 기기에 건넬 연결 표
  if (T0 || IMP || PAIR) { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) { try { location.hash = ""; } catch (e2) {} } }
  function fail(status, message) { var e = new Error(message || ("HTTP " + status)); e.status = status; return e; }

  /* ---------- 통신 ---------- */
  async function http(method, url, body, kind) {                       // kind: 없음 = JSON · "form" · "plain"(브라우저가 미리 묻지 않는 단순 요청)
    var ctl = ("AbortController" in window) ? new AbortController() : null, timer = setTimeout(function () { if (ctl) ctl.abort(); }, 20000);
    var opt = { method: method, cache: "no-store", signal: ctl ? ctl.signal : undefined };
    if (body !== undefined) {
      opt.body = kind === "form" ? body : JSON.stringify(body);
      if (kind !== "plain") opt.headers = { "Content-Type": kind === "form" ? "application/x-www-form-urlencoded" : "application/json" };
    }
    var r;
    try { r = await fetch(url, opt); } catch (e) { clearTimeout(timer); var f = fail(0, tx("인터넷 연결을 확인하세요.", "Check the internet connection.")); f.url = url; throw f; }
    clearTimeout(timer);
    var j = null; try { j = await r.json(); } catch (e) { /* 본문 없음 */ }
    return { status: r.status, json: j };
  }
  function claims(t) {                                                 // 로그인 표(JWT) 가운데 토막
    try { var p = String(t).split(".")[1].replace(/-/g, "+").replace(/_/g, "/"); while (p.length % 4) p += "="; return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(p), function (c) { return c.charCodeAt(0); }))) || {}; } catch (e) { return {}; }
  }
  function keep(a) {
    a.at = Date.now(); auth = a; save("mrx.auth", a);
    if (a.ws) {                                                        // Workspace 계정: 이름 · 등급 · 기한은 표에 적힌 것(서버가 서명) — 화면에서 바꿀 수 없음
      var c = claims(a.idToken), uid = String(c.user_id || c.sub || a.uid || ""), m = /^ws:(\d+)$/.exec(uid);
      who = { ws: 1, id: m ? +m[1] : uid, name: String(c.n || ""), lv: c.lv === "a" || c.lv === "v" ? c.lv : "u", until: +c.until || 0, pj: String(c.pj || ""), tm: String(c.tm || "") };
      save("mrx.me", who);
    }
  }
  async function custom(tok) {                                         // Workspace 가 떼어 준 연결 표 → Firebase 로그인 표 (저장하지 않음)
    var u = AUTH_URL + "/accounts:signInWithCustomToken?key=" + encodeURIComponent(CFG.apiKey), body = { token: tok, returnSecureToken: true }, r;
    try { r = await http("POST", u, body); } catch (e) { r = await http("POST", u, body, "plain"); }
    if (r.status !== 200 || !r.json || !r.json.idToken) {
      var raw = String((r.json && r.json.error && r.json.error.message) || "");
      throw fail(r.status || 500, (/CREDENTIAL_MISMATCH/.test(raw) ? tx("서버 PC 의 키 파일이 이 Firebase 프로젝트의 것이 아닙니다. ", "The key file on the server PC belongs to a different Firebase project. ")
        : tx("연결 표가 만료되었거나 맞지 않습니다. Workspace 에서 다시 여세요 (서버 PC 의 시계가 틀려도 이렇게 됩니다). ", "The link has expired or is not valid. Open it from Workspace again (a wrong clock on the server PC also causes this). ")) + raw);
    }
    if (claims(r.json.idToken).ws !== 1) throw fail(400, tx("Workspace 의 연결 표가 아닙니다.", "This is not a Workspace link."));
    return r.json;
  }
  async function link(tok) {                                           // 이 브라우저를 그 계정으로 연결 (저장)
    var j = await custom(tok);
    keep({ ws: 1, uid: "", idToken: j.idToken, refreshToken: j.refreshToken, exp: Date.now() + (+j.expiresIn || 3600) * 1000 });
  }
  async function signUp() {                                            // 익명 계정 만들기 (이 브라우저 전용)
    var u = AUTH_URL + "/accounts:signUp?key=" + encodeURIComponent(CFG.apiKey), r;
    try { r = await http("POST", u, { returnSecureToken: true }); }
    catch (e) { r = await http("POST", u, { returnSecureToken: true }, "plain"); }      // 미리 묻기가 길에서 막힌 경우를 대비해 한 번 더
    if (r.status !== 200 || !r.json || !r.json.idToken) throw fail(r.status || 500, tx("로그인 서버가 거절했습니다 (Firebase 의 '익명' 로그인이 켜져 있는지 확인). ", "The sign-in server refused (is Anonymous sign-in enabled in Firebase?). ") + ((r.json && r.json.error && r.json.error.message) || ""));
    keep({ uid: r.json.localId, idToken: r.json.idToken, refreshToken: r.json.refreshToken, exp: Date.now() + (+r.json.expiresIn || 3600) * 1000 });
  }
  async function refresh() {
    var r = await http("POST", TOKEN_URL + "/token?key=" + encodeURIComponent(CFG.apiKey), "grant_type=refresh_token&refresh_token=" + encodeURIComponent(auth.refreshToken), "form");
    if (r.status !== 200 || !r.json || !r.json.id_token) throw fail(r.status || 500, "refresh");
    keep({ ws: auth.ws, uid: r.json.user_id || auth.uid, idToken: r.json.id_token, refreshToken: r.json.refresh_token || auth.refreshToken, exp: Date.now() + (+r.json.expires_in || 3600) * 1000 });

<script>
/* Logicwon Workspace storage adapter for the meeting room tool.
   The booking logic was written against a small document store (doc/collection/onSnapshot/acquire).
   This adapter provides that same interface on top of LW.store (the Workspace server's per-tool storage):
     config/main      -> key "config.main"
     series/<id>      -> key "series"        (one map of all repeat rules)
     days/<date>      -> key "days.<YYYY-MM>" (one map per month)
     locks/main       -> key "lock"          (short lease, taken with optimistic concurrency) */
var LWDB = (function () {
  "use strict";
  var listeners = {};          // key -> [fn(value)]
  var cache = {};              // key -> last value
  function notify(key, value) { cache[key] = value; (listeners[key] || []).slice().forEach(function (fn) { try { fn(value); } catch (e) { console.error(e); } }); }
  function watchKey(key, fn) {
    (listeners[key] = listeners[key] || []).push(fn);
    var stop = LW.store.watch(key, function (v) { notify(key, v); }, 4000);
    if (key in cache) setTimeout(function () { fn(cache[key]); }, 0);
    return function () { stop(); listeners[key] = (listeners[key] || []).filter(function (f) { return f !== fn; }); };
  }
  function err(e) { var c = e && e.status === 403 ? "invalid_argument" : (e && e.status === 0 ? "unavailable" : "unknown"); return {code: c, message: e && e.message}; }
  function snapDoc(id, data) { return {id: id, exists: data != null, data: function () { return data == null ? undefined : JSON.parse(JSON.stringify(data)); }, metadata: {fromCache: false}}; }
  function snapDocs(map) {
    var docs = Object.keys(map || {}).sort().map(function (id) { return snapDoc(id, map[id]); });
    return {docs: docs, size: docs.length, empty: !docs.length, metadata: {fromCache: false}, docChanges: function () { return []; }};
  }
  function where(path) {             // -> {key, field} for a document path
    var p = path.split("/");
    if (p[0] === "config") return {key: "config." + p[1], field: null};
    if (p[0] === "series") return {key: "series", field: p[1]};
    if (p[0] === "days") return {key: "days." + p[1].slice(0, 7), field: p[1]};
    if (p[0] === "locks") return {key: "lock", field: null};
    throw new Error("unknown path " + path);
  }
  function doc(path) {
    var w = where(path), id = path.split("/").pop();
    return {
      id: id, path: path,
      get: async function () {
        try { var v = await LW.store.get(w.key, null); cache[w.key] = v; return snapDoc(id, w.field ? (v || {})[w.field] : v); }
        catch (e) { throw err(e); }
      },
      set: async function (data) {
        try {
          var v = w.field
            ? await LW.store.update(w.key, function (m) { m = m || {}; m[w.field] = data; return m; }, {})
            : (await LW.store.set(w.key, data), data);
          notify(w.key, v);
        } catch (e) { throw err(e); }
      },
      update: async function (data) { var s = await this.get(); var cur = s.exists ? s.data() : {}; Object.keys(data).forEach(function (k) { cur[k] = data[k]; }); return this.set(cur); },
      delete: async function () {
        try {
          if (!w.field) { await LW.store.set(w.key, null); notify(w.key, null); return; }
          var v = await LW.store.update(w.key, function (m) { m = m || {}; delete m[w.field]; return m; }, {});
          notify(w.key, v);
        } catch (e) { throw err(e); }
      },
      onSnapshot: function (next, onErr) {
        return watchKey(w.key, function (v) { next(snapDoc(id, w.field ? (v || {})[w.field] : v)); });
      },
      /* lease: free if empty, expired, or already ours */
      acquire: async function (o) {
        var now = Date.now(), got = false;
        try {
          await LW.store.update(w.key, function (cur) {
            if (cur && cur.holder !== o.holder && cur.until > now) { got = false; return cur; }
            got = true; return {holder: o.holder, until: now + (o.ttlMs || 8000)};
          }, null);
        } catch (e) { throw err(e); }
        return {acquired: got};
      },
      release: async function (holder) {
        try { await LW.store.update(w.key, function (cur) { return cur && cur.holder === holder ? {holder: "", until: 0} : cur; }, null); } catch (e) { /* lease expires anyway */ }
      },
    };
  }
  function collection(name) {
    function monthsOf(op, val) { return op === "in" ? val : [val]; }
    function query(months) {
      var keys = name === "days" ? months.map(function (m) { return "days." + m; }) : [name];
      function merged() { var out = {}; keys.forEach(function (k) { var v = cache[k] || {}; Object.keys(v).forEach(function (id) { out[id] = v[id]; }); }); return out; }
      return {
        get: async function () {
          try { for (var i = 0; i < keys.length; i++) cache[keys[i]] = await LW.store.get(keys[i], {}); }
          catch (e) { throw err(e); }
          return snapDocs(merged());
        },
        onSnapshot: function (next) {
          var seen = {}, stops = keys.map(function (k) {
            return watchKey(k, function () { seen[k] = 1; if (Object.keys(seen).length === keys.length) next(snapDocs(merged())); });
          });
          return function () { stops.forEach(function (s) { s(); }); };
        },
      };
    }
    var all = query([]);
    return {
      where: function (field, op, val) { return query(monthsOf(op, val)); },
      get: all.get, onSnapshot: all.onSnapshot,
      doc: function (id) { return doc(name + "/" + id); },
    };
  }
  return {doc: doc, collection: collection};
})();

    var NR = [D.noRooms, ["등록된 회의실이 없습니다. [관리자 코드]를 넣으면 회의실을 등록할 수 있습니다.", "No rooms have been added yet. Enter the admin code to add rooms."],
              ["등록된 회의실이 없습니다. 포털 관리자가 회의실을 등록하면 보입니다.", "No rooms have been added yet. A portal admin can add rooms."]];
    var me;
    try { me = await EXT.ready(); } catch (e) { S.dead = "noHost"; S.cfgLoaded = true; render(); return; }
    function apply(m) {
      S.myId = m.id; S.myName = m.name || ""; S.isOwner = !!m.admin; S.canEdit = !!m.admin; S.canWrite = m.write !== false;
      S.myProject = m.project || ""; S.myTeam = m.team || "";                           // Workspace 프로필의 프로젝트 · 팀 = 예약 창의 첫 값
      if (m.name) store("roomBookName", m.name);
      D.noRooms = NR[m.admin ? 0 : m.ws ? 2 : 1];
    }
    apply(me);
    [["xWho", function () { EXT.change(); }], ["xAdmin", function () { EXT.admin(); }], ["xImport", function () { EXT.importOpen(false); }]].forEach(function (x) {
      var b = document.createElement("button"); b.className = "btn"; b.type = "button"; b.id = x[0]; b.dataset.t = x[0] === "xAdmin" && me.admin ? "xAdminOn" : x[0] === "xWho" && me.ws ? "xWsWho" : x[0]; b.onclick = x[1];
      if (x[0] === "xImport" && !(me.ws && me.admin)) b.hidden = true;                   // 0.3: 사내 예약 가져오기 — Workspace 의 포털 관리자만
      if (x[0] === "xAdmin" && me.ws) b.hidden = true;                                   // Workspace 계정: 관리자는 Workspace 등급을 따름 (관리자 코드 없음)
      $("morePanel").appendChild(b);
    });
    applyStatic();
    EXT.onUpdate = function (m) { apply(m); $("xAdmin").dataset.t = m.admin ? "xAdminOn" : "xAdmin"; $("xImport").hidden = !(m.ws && m.admin); applyStatic(); render(); };
    EXT.onDenied = function () { S.dead = "signIn"; render(); EXT.rejoin(); };
    S.db = LWDB;
    S.db.doc("config/main").onSnapshot(function (snap) { S.cfg = snap.exists ? snap.data() : null; S.cfgLoaded = true; render(); }, onDead);
    S.db.collection("series").onSnapshot(function (snap) {
      var all = {}; snap.docs.forEach(function (doc) { all[doc.id] = doc.data() || {}; });
      S.series = all; render();
    }, onDead);
    subscribeRange(); render();
    if (EXT.wantImport) EXT.importOpen(true);                                            // 0.3: Workspace 의 [전환] · [자료 옮기기]로 열린 탭 → 사내 자료를 받아 가져오기 창
  })();
})();
</script>
